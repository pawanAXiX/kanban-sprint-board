openapi: 3.0.3
info:
  title: Task Management API
  version: 1.0.0
  description: API for managing tasks, including CRUD and reordering functionality.

servers:
  - url: http://localhost/api

paths:
  /tasks:
    get:
      summary: Get all tasks
      responses:
        '200':
          description: List of tasks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: './schemas.yaml#/components/schemas/Task'

    post:
      summary: Create a new task
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './schemas.yaml#/components/schemas/CreateTaskRequest'
      responses:
        '201':
          description: Task created successfully
          content:
            application/json:
              schema:
                $ref: './schemas.yaml#/components/schemas/Task'

  /tasks/{task}:
    get:
      summary: Get a single task
      parameters:
        - in: path
          name: task
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: A task
          content:
            application/json:
              schema:
                $ref: './schemas.yaml#/components/schemas/Task'

    put:
      summary: Update a task
      parameters:
        - in: path
          name: task
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './schemas.yaml#/components/schemas/UpdateTaskRequest'
      responses:
        '200':
          description: Task updated successfully
          content:
            application/json:
              schema:
                $ref: './schemas.yaml#/components/schemas/Task'

    delete:
      summary: Delete a task
      parameters:
        - in: path
          name: task
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Task deleted successfully

  /tasks/{task}/reorder:
    post:
      summary: Reorder the given task
      parameters:
        - in: path
          name: task
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - newStatus
                - index
              properties:
                newStatus:
                  type: string
                  example: in progress
                index:
                  type: integer
                  example: 2
      responses:
        '200':
          description: Task reordered successfully
          content:
            application/json:
              schema:
                $ref: './schemas.yaml#/components/schemas/Task'
